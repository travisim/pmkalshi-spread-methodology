[package]
name = "pmkalshi-methodology-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-venue prediction-market pair discovery harness (Polymarket <-> Kalshi). Method + code + honest zero result: 16 candidate pairs, 0 verified."
repository = "https://github.com/travisim/pmkalshi-spread-methodology"
keywords = ["prediction-markets", "polymarket", "kalshi", "methodology"]
categories = ["command-line-utilities"]

# Standalone public repo: deliberately not part of any outer Cargo workspace.
[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lib]
name = "harness"
path = "src/lib.rs"

[[bin]]
name = "pmkalshi-harness"
path = "src/main.rs"
